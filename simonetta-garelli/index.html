// Client-side consistency hint only; never a real booking lookup or a submission block.
function updateDateWarning(){
 const hint=$('date-warning');if(!hint)return;
 const from=$('checkin').value,to=$('checkout').value,day=$('day').value;
 let key='';
 if(from && to && to<=from)key='dateWarnOrder';
 else if(from && to && day && (day<from || day>to))key='dateWarnOutside';
 hint.textContent=key?common(key):'';hint.hidden=!key;
}

}

const SUBJECT='RICHIESTA OSPITI VILLA MAFALDA - SAVIGNANO SUL PANARO';
function getRequest(){
 const f=$('form');if(!f.reportValidity())return null;
 const v=id=>$(id).value.trim();const i=parseInt(v('detail')||'0',10);
 updateDateWarning(); // Avviso informativo; nessuna verifica delle prenotazioni in Airbnb / SmartPMS.
 const italianOffer=(PAGE.it.opt[i]||tr('opt')[i]);
 const italianMenu=(PAGE.it.menus[Number(v('menu')||0)]||PAGE.it.menus[0])[0];
 const place=i===1?'Casa di Simonetta (indirizzo da concordare direttamente con la chef)':'Villa Mafalda';
 const timeLabel=(COMMON.it[v('time')]||v('time'));
 const langLabel=({it:'Italiano',en:'Inglese',de:'Tedesco',fr:'Francese',es:'Spagnolo'})[lang]||lang.toUpperCase();
 const lines=[SUBJECT,'',
   'Richiesta di disponibilità per: '+italianOffer,
   'Luogo dell’esperienza: '+place,
   ...(i===0?['Menu selezionato: '+italianMenu]:[]),'',
   'DATI DELLA RICHIESTA',
   'Nome e cognome: '+v('name'),
   'Email: '+v('email'),
   'Telefono / WhatsApp: '+(v('contact')||'Non indicato'),
   'Numero partecipanti: '+v('people'),
   'Check-in Villa Mafalda: '+v('checkin'),
   'Check-out Villa Mafalda: '+v('checkout'),
   'Data desiderata per l’esperienza: '+v('day'),
   'Orario preferito: '+timeLabel,
   'Note / richieste particolari: '+(v('notes')||'Nessuna'),
   'Lingua dell’ospite: '+langLabel,'',
   'Restiamo in attesa di un cortese riscontro sulla disponibilità e sulle modalità di conferma.','',
   'Grazie.'];
 return lines.join('\n');
}
function showStatus(s,error){let el=$('form-status');el.className='form-status visible'+(error?' error':'');el.textContent=s;}
function openMessage(kind){
 const message=getRequest();if(!message)return;
 $('prepared').value=message;$('fallback').hidden=false;showStatus(common('appopen'),false);
 if(kind==='email'){
  const subject=SUBJECT+' - '+otherNames[CONFIG.slug];
  window.location.href='mailto:'+CONFIG.email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(message);
 }else if(kind==='wa' && CONFIG.wa){
  window.open('https://wa.me/'+CONFIG.wa+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');
 }
}
