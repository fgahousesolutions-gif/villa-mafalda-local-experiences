const el = id => document.getElementById(id);
const setText = (id,value) => {const node=el(id); if(node) node.textContent=value ?? '';};
const node=(tag,cls,txt) => {const e=document.createElement(tag); if(cls)e.className=cls; if(txt!==undefined)e.textContent=txt; return e;};
const partnerUrl=()=>language==='it'?CONFIG.urls.it:CONFIG.urls.en;
function render(){
 const d=DATA[language]; document.documentElement.lang=language;
 document.title='Villa Mafalda | Acetaia Sereni · '+d.badge;
 for(const [id,key] of Object.entries({'badge':'badge','hero-eyebrow':'heroEyebrow','hero-title':'heroTitle','hero-text':'heroText','intro-over':'introOver','intro-title':'introTitle','intro-text':'introText','discount-eyebrow':'discountEyebrow','discount-title':'discountTitle','discount-text':'discountText','copy-code':'copy','discount-caveat':'discountCaveat','offer-head':'offerHead','offer-intro':'offerIntro','optional-label':'optionalLabel','optional-head':'optionalHead','optional-intro':'optionalIntro','steps-label':'stepsLabel','steps-title':'stepsTitle','steps-intro':'stepsIntro','steps-foot':'stepsFoot','all-experiences':'all','info-tag':'infoTag','info-title':'infoTitle','info-text':'infoText','site-link':'site','maps-link':'maps','legal':'legal','where-tag':'whereTag','where-title':'whereTitle','where-text':'whereText','map-button':'mapButton','footer-text':'footerText'})) setText(id,d[key]);
 setText('booking-note',d.legal);
 setText('copy-result','');
 document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.lang===language)));
 const features=el('features');features.replaceChildren();for(const [head,body] of d.feat){let c=node('div','feature');c.append(node('b','',head),node('span','',body));features.append(c)}
 const root=el('offer-groups');root.replaceChildren();
 for(const category of ['essential','superior','deluxe']){
   const group=node('section','offer-group');const [label,title,description]=d.categories[category];
   const top=node('div','category');const text=node('div','');text.append(node('span','offer-tag',label),node('h3','',title),node('p','',description));top.append(text);group.append(top);
   const grid=node('div','experiences');
   for (const offer of CONFIG.offers.filter(o=>o.cat===category)){
      const [title,description]=d.offers[offer.id];
      const card=node('article','experience');card.append(node('span','chip',label),node('h3','',title),node('p','',description),node('span','fine',d.duration+' · '+offer.duration));
      const anchor=node('a','action',d.book);anchor.href=offer.url;anchor.target='_blank';anchor.rel='noopener noreferrer';anchor.setAttribute('aria-label',d.book+' — '+title);card.append(anchor);grid.append(card);
   }
   group.append(grid);root.append(group);
 }
 const optional=el('optional-grid');optional.replaceChildren();
 for(const [title,description,price] of d.addons){let card=node('article','optional-card');card.append(node('h3','',title),node('p','',description),node('span','optional-price',price));optional.append(card)}
 const steps=el('steps');steps.replaceChildren();for(const [i,pair] of d.steps.entries()){const [title,description]=pair;const card=node('article','step');card.append(node('span','num',String(i+1)),node('h3','',title),node('p','',description));steps.append(card)}
 const bullets=el('info-bullets');bullets.replaceChildren(...d.bullet.map(x=>node('li','',x)));
 el('all-experiences').href=partnerUrl();el('site-link').href=partnerUrl();el('maps-link').href=CONFIG.maps;el('map-button').href=CONFIG.maps;
 try{localStorage.setItem('guestGuideLang',language)}catch(e){}
}
async function copyCode(){
 let ok=false;
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(code);ok=true}}catch(e){}
 if(!ok){try{const field=document.createElement('textarea');field.value=code;field.style.position='fixed';field.style.left='-2000px';document.body.append(field);field.focus();field.select();ok=document.execCommand('copy');field.remove()}catch(e){}}
 setText('copy-result',ok?DATA[language].copied:DATA[language].copyFail);
}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{language=b.dataset.lang;render()}));
el('copy-code').addEventListener('click',copyCode);
const search=new URLSearchParams(location.search);let stored='';try{stored=localStorage.getItem('guestGuideLang')}catch(e){}
language=DATA[search.get('lang')]?search.get('lang'):(DATA[stored]?stored:'it');render();
</script></body></html>
